name: inkora
description: "A fast, offline-first Komga reader for Android and iOS."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  drift: ^2.35.2
  go_router: ^18.0.2
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  crypto: ^3.0.7
  intl: ^0.20.3
  flutter_readium: 0.6.2
  pdfrx: 2.6.5
  file_picker: 13.1.0
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  url_launcher_platform_interface: 2.3.2
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  integration_test:
    sdk: flutter


flutter:
  shaders:
    - assets/shaders/image_enhancement.frag
    - assets/shaders/surface_enhancement.frag

  uses-material-design: true
  assets:
    - VERSION
    - CHANGELOG.md
    - assets/fonts/OFL.txt
    - assets/icons/LICENSE.txt
    - assets/licenses/pdfium-notices.txt
    - assets/licenses/readium-sdk.txt
  fonts:
    - family: LibreBaskerville
      fonts:
        - asset: assets/fonts/LibreBaskerville.ttf
    - family: PhosphorRegular
      fonts:
        - asset: assets/icons/Phosphor-Regular.ttf
