    sudo:
      - apt-get update
      - apt-get install -y build-essential git ninja-build pkg-config unzip rustup openjdk-21-jdk-headless
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@abaf9c523780a608bd46686fd5e53740a07077f8
