    prebuild:
      - export INKORA_PUB_CACHE=$PWD/.fdroid-pub-cache
      - export PUB_CACHE=$INKORA_PUB_CACHE
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - python3 fdroid/prepare.py --pub-cache "$PUB_CACHE" --pdfium $$pdfium-binaries$$
    scandelete:
      - .fdroid-pub-cache
    build:
      - pushd $$pdfium-binaries$$
      - export PDFium_BRANCH=chromium/7811 PDFium_VERSION=149.0.7811.0
      - ./build.sh -b "$PDFium_BRANCH" android arm
      - ./build.sh -b "$PDFium_BRANCH" android arm64
      - ./build.sh -b "$PDFium_BRANCH" android x64
      - popd
      - export INKORA_PUB_CACHE=$PWD/.fdroid-pub-cache
      - export PUB_CACHE=$INKORA_PUB_CACHE
      - export INKORA_FLUTTER_ROOT=$$flutter$$
      - export INKORA_JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      - export INKORA_ANDROID_HOME=$$SDK$$
      - export INKORA_GRADLE_USER_HOME=$HOME/.gradle
      - scripts/build.sh apk --release --unsigned --target-platform=android-arm,android-arm64,android-x64
